site_name: "watsonx Orchestrate × Confluent ハンズオンガイド"
site_url: https://thayate.github.io/bob-wxo-confluent-handson/
site_description: "Confluent Cloud (Apache Kafka) × watsonx Orchestrate イベント駆動型エージェント デモ手順書"
repo_name: thayate/bob-wxo-confluent-handson
repo_url: https://github.com/thayate/bob-wxo-confluent-handson

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - ホーム: index.md
  - デモ概要: overview.md
  - 前提条件: prerequisites.md
  - セットアップ手順:
    - Step 1 リポジトリ取得と環境準備: steps/step1.md
    - Step 2 Confluent Cloud クラスター作成: steps/step2.md
    - Step 3 .env ファイル作成: steps/step3.md
    - Step 4 トピック作成とサンプルデータ投入: steps/step4.md
    - Step 5 ksqlDB クラスター作成と集計定義: steps/step5.md
    - Step 6 MCP ツールのローカル検証: steps/step6.md
    - Step 7 MCP ツールを watsonx Orchestrate に取り込む: steps/step7.md
    - Step 8 SKU Availability Agent のインポート: steps/step8.md
    - Step 9 Substitute Finder Agent の作成: steps/step9.md
    - Step 10 Store Associate Agent の作成: steps/step10.md
  - デモシナリオ: demo-scenario.md
  - 付録:
    - 対象 SKU / 店舗: appendix/sku-list.md
    - ファイル一覧: appendix/file-list.md
    - トラブルシューティング: appendix/troubleshooting.md
    - 拡張アイデア: appendix/extensions.md
